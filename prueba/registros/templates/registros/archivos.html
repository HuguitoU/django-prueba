{% extends "inicio/encabezado.html" %}

{% block titulo %}
    Cargar Archivo
{% endblock %}

{% block textoarriba %}
				<!--Encabezdo -->
			<div class="page-header">
				<div class="page-title">
					<h3>Envia tu documento
				    <small>...</small></h3>
				</div>
			</div>
			<!-- /Encabezado-->
{%endblock%}

{% block contenido %}
	
			<!-- Formulario -->
			<form class="form-horizontal" action="{%url 'Subir'%}" method = "POST" role="form" enctype = "multipart/form-data">
				{% csrf_token %}
	            <div class="panel panel-default">
	                <div class="panel-body">

				        <div class="form-group">
				            <label class="col-sm-2 control-label text-right">Título:</label>
				            <div class="col-sm-10">
				            	<input name = "titulo" type="text" class="form-control">
				            </div>
				        </div>

                        <div class="form-group">
				            <label class="col-sm-2 control-label text-right">Descripción:</label>
				            <div class="col-sm-10">
				            	<p><textarea name = "descripcion" cols = "50" rows = "10" class="form-control"></textarea></p>
				            </div>
				        </div>

                        <div class="form-group">
				            <label class="col-sm-2 control-label text-right">Archivo:</label>
				            <div class="col-sm-10">
				            	<input name = "archivo" type="file">
				            </div>
				        </div>

                        <div class="form-actions text-right">
                        	<input type="submit" value="Enviar" class="btn btn-primary">
                        </div>

				    </div>
				</div>
			</form>
		<!-- Fin del Formulario -->
		
		<!-- /Contenido Principal-->

{% endblock %}
